<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000"><title>Lens Hire &amp; Lens Jobs</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
/* Layout: responsive hiring app. Desktop = sidebar + main; tablet = icon rail; mobile = full-bleed dark headers, sheet bodies, floating dark tab bar and bottom decision panels. Same language as Shortlist Lens: sentence headers, big thin numbers, grey tiles, lime accent. */
:root{
  --bg:#FFFFFF; --card:#F3F3F5; --card2:#E7E7EA; --ink:#0B0B0C; --muted:#66666B; --line:#D9D9DE;
  --hd:#0E0E10; --hd-ink:#FFFFFF; --hd-muted:rgba(255,255,255,.5); --hd-chip:rgba(255,255,255,.12);
  --blue:#2357F5; --lime:#CBF34A; --lime-ink:#111400; --cal:#B23A0A;
  --good:#12703F; --warn:#946200; --bad:#C8323A; --warn-soft:#FFF2CC; --bad-soft:#FDE4E5; --good-soft:#E2F5EA;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 10px 30px rgba(0,0,0,.08);
  --f:'Geist',-apple-system,'SF Pro Text',system-ui,sans-serif;
  --f-mono:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --ease:cubic-bezier(.22,.9,.24,1); --spring:cubic-bezier(.32,.72,0,1);
  --gl:max(16px,env(safe-area-inset-left,0px)); --gr:max(16px,env(safe-area-inset-right,0px));
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000000; --card:#1C1C1E; --card2:#2C2C2E; --ink:#F5F5F7; --muted:#8E8E93; --line:#3A3A3C;
  --hd:#1C1C1E; --good:#32D074; --warn:#FFC23D; --bad:#FF6B6F; --warn-soft:#3A2D0B; --bad-soft:#3D1618; --good-soft:#12301F;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --card:#1C1C1E; --card2:#2C2C2E; --ink:#F5F5F7; --muted:#8E8E93; --line:#3A3A3C;
  --hd:#1C1C1E; --good:#32D074; --warn:#FFC23D; --bad:#FF6B6F; --warn-soft:#3A2D0B; --bad-soft:#3D1618; --good-soft:#12301F;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.4); color-scheme:dark}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.42;-webkit-font-smoothing:antialiased}
h1,h2,h3,p{margin:0}
h1,h2,h3{font-weight:600;letter-spacing:-.02em;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input,textarea{font:inherit;color:var(--ink)}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:10px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
.xs{font-size:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:12px}
.nowrap{flex-wrap:nowrap}
svg.i{width:18px;height:18px;flex:none}

/* shell */
.shell{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;padding:22px 14px;display:flex;flex-direction:column;gap:22px;border-right:1px solid var(--card2);background:var(--bg);z-index:5}
.brand{display:flex;align-items:center;gap:10px;font-size:21px;font-weight:600;letter-spacing:-.03em;padding:0 8px}
.logo{width:28px;height:28px;border-radius:50%;flex:none;border:2px solid var(--ink);background:radial-gradient(circle,var(--ink) 1.2px,transparent 1.5px) 0 0/6px 6px}
.nav{position:relative;display:flex;flex-direction:column;gap:2px}
.nav button{position:relative;z-index:1;display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:14px;font-size:15px;font-weight:500;color:var(--muted);transition:color .3s}
.nav button svg{width:20px;height:20px;flex:none}
.nav button[aria-current="true"]{color:var(--bg)}
.vind{position:absolute;left:0;right:0;top:0;height:44px;border-radius:14px;background:var(--ink);transition:transform .5s var(--spring),opacity .3s}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.cvbtn{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:16px;background:var(--blue);color:#fff;font-weight:500;font-size:14px;transition:transform .15s}
.cvbtn:active{transform:scale(.97)}
.cvdot{width:8px;height:8px;border-radius:50%;background:var(--lime);flex:none}
.me{display:flex;align-items:center;gap:10px;padding:4px 6px;font-size:14px}
.me .sub{display:block;color:var(--muted);font-size:12px}
.main{min-width:0;width:100%;max-width:1220px;margin:0 auto;padding:18px 28px 120px}
.journey{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.journey .jl{font-size:12px;color:var(--muted);margin-right:4px}
.journey button{padding:6px 11px;border-radius:999px;font-size:12px;font-weight:500;background:var(--card);color:var(--muted);transition:background .25s,color .25s,transform .15s;white-space:nowrap}
.journey button:active{transform:scale(.95)}
.journey button[aria-current="true"]{background:var(--ink);color:var(--bg)}
.tabbar{display:none}

@media (max-width:1023px){
  .shell{grid-template-columns:84px minmax(0,1fr)}
  .side{padding:22px 12px;align-items:stretch}
  .side .lbl,.brand b{display:none}
  .brand{justify-content:center;padding:0}
  .nav button{justify-content:center;padding:12px}
  .vind{height:46px}
  .cvbtn,.me{justify-content:center}
  .main{padding:18px 22px 120px}
}
@media (max-width:699px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .main{padding:0 var(--gr) 150px var(--gl)}
  .journey{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 calc(-1*var(--gr)) 0 calc(-1*var(--gl));padding:10px var(--gr) 10px var(--gl);border-bottom:1px solid var(--card2)}
  .journey::-webkit-scrollbar{display:none}
  .journey .jl{display:none}
  .tabbar{display:flex;position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:40;gap:4px;padding:5px;border-radius:999px;background:rgba(12,12,14,.86);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);border:1px solid rgba(255,255,255,.09);box-shadow:0 12px 32px rgba(0,0,0,.45);transition:transform .45s var(--spring),opacity .3s}
  .tabbar.away{transform:translate(-50%,140%);opacity:0;pointer-events:none}
  .tabbar button{position:relative;z-index:1;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;color:rgba(255,255,255,.55);transition:color .3s}
  .tabbar button svg{width:20px;height:20px;transition:transform .35s var(--spring)}
  .tabbar button[aria-current="true"]{color:#0B0B0C}
  .tabbar .ind{position:absolute;left:0;top:9px;width:40px;height:40px;border-radius:50%;background:#fff;transition:transform .5s var(--spring),opacity .3s}
}

/* view scaffolding */
.view{display:flex;flex-direction:column;gap:20px}
.head{background:var(--hd);color:var(--hd-ink);border-radius:30px;padding:26px 30px 30px;display:flex;flex-direction:column;gap:18px;overflow:hidden}
.head.blue{background:var(--blue)}
.body{display:flex;flex-direction:column;gap:22px}
.say{font-size:clamp(24px,2.5vw,34px);line-height:1.26;font-weight:500;letter-spacing:-.03em;color:var(--hd-muted);max-width:32ch}
.say b{color:var(--hd-ink);font-weight:500}
.say .ico{width:.82em;height:.82em;vertical-align:-.07em;color:var(--hd-ink)}
.idot{display:inline-block;width:.34em;height:.34em;border-radius:50%;background:var(--c);vertical-align:.16em;margin:0 .14em 0 .06em}
.inav{width:2.6em;height:2.6em;border-radius:50%;display:inline-grid;place-items:center;font-size:.4em;line-height:1;font-weight:600;background:var(--hd-ink);color:var(--hd);vertical-align:.25em;letter-spacing:.02em;margin:0 .15em;flex:none}
.head.blue .inav{color:var(--blue)}
.ipill{display:inline-flex;align-items:center;gap:.25em;padding:.06em .42em;border-radius:999px;background:var(--lime);color:var(--lime-ink);font-size:.78em;vertical-align:.06em}
.meta{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--hd-muted);align-items:center}
.meta span{display:inline-flex;gap:6px;align-items:center}
.meta svg{width:14px;height:14px}
.topnav{display:flex;align-items:center;justify-content:space-between;gap:10px}
.cbtn{width:38px;height:38px;border-radius:50%;background:var(--hd-chip);color:var(--hd-ink);display:grid;place-items:center;flex:none;transition:transform .15s}
.cbtn:active{transform:scale(.92)}
.cbtn svg{width:16px;height:16px}
.gpill{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;background:var(--hd-chip);color:var(--hd-ink);font-size:14px;font-weight:500;transition:transform .15s}
.gpill:active{transform:scale(.95)}
.gpill svg{width:14px;height:14px}
.datebar{display:flex;justify-content:space-between;align-items:flex-start}
.datebar h1{font-size:34px;font-weight:600;letter-spacing:-.03em;display:flex;align-items:center;gap:8px}
.datebar h1 i{width:9px;height:9px;border-radius:50%;background:#FF5A4E;display:block}
.datebar p{text-align:right;font-size:13px;color:var(--hd-muted);line-height:1.25}
.cvbar{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--card);border-radius:18px;padding:10px 10px 10px 16px;font-size:13px}

@media (max-width:699px){
  .view{padding-top:0}
  .view.has-head{gap:0}
  .head{margin:0 calc(-1*var(--gr)) 0 calc(-1*var(--gl));border-radius:0;padding:18px var(--gr) 48px var(--gl);gap:16px}
  .body{position:relative;margin:-28px calc(-1*var(--gr)) 0 calc(-1*var(--gl));padding:22px var(--gr) 0 var(--gl);background:var(--bg);border-radius:30px 30px 0 0}
  .say{font-size:24px}
  .view.light{padding-top:16px}
  .cvbar{margin:12px 0}
}

/* type */
.big{font-size:clamp(28px,3vw,38px);line-height:1.12;font-weight:600;letter-spacing:-.03em}
.big .ico{width:.82em;height:.82em;vertical-align:-.06em}
.tt{font-size:22px;font-weight:600;letter-spacing:-.025em}
.tt span{color:var(--muted)}
.step{font-size:14px;font-weight:500}
.hero-num{font-size:72px;font-weight:300;letter-spacing:-.06em;line-height:.95}
.hero-num small{font-size:20px;color:var(--muted);letter-spacing:0;margin-left:4px;font-weight:400}

/* components */
.card{background:var(--card);border-radius:24px;padding:18px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:500;background:var(--bg);white-space:nowrap}
.pill i{width:6px;height:6px;border-radius:50%;background:var(--c,var(--muted))}
.pill.grey{background:var(--card)}
.pill.lime{background:var(--lime);color:var(--lime-ink)}
.pill.dark{background:var(--ink);color:var(--bg)}
.chip{border:1.5px solid var(--line);background:var(--bg);border-radius:999px;padding:9px 15px;font-size:14px;font-weight:500;transition:background .22s,color .22s,border-color .22s,transform .15s,opacity .2s}
.chip:active{transform:scale(.95)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip[disabled]{opacity:.35;cursor:not-allowed}
.chip.lock{display:inline-flex;gap:6px;align-items:center;cursor:default}
.chip.lock svg{width:12px;height:12px;color:var(--muted)}
.chip.lime{background:var(--lime);color:var(--lime-ink);border-color:var(--lime)}
.card .chip{border-color:transparent}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;padding:13px 20px;font-weight:600;font-size:15px;background:var(--card);transition:transform .15s var(--ease),opacity .2s,background .2s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--ink);color:var(--bg)}
.btn.lime{background:var(--lime);color:var(--lime-ink)}
.btn.sm{padding:9px 14px;font-size:14px}
.btn.ghost{background:none}
.btn.block{width:100%;padding:17px;border-radius:20px;font-weight:500;font-size:16px}
.btn[disabled]{opacity:.35;cursor:not-allowed;transform:none}
.btn svg{width:16px;height:16px}
.tile{width:42px;height:42px;border-radius:13px;background:var(--bg);display:grid;place-items:center;flex:none}
.tile svg{width:19px;height:19px}
.tile.ok{background:var(--lime);color:var(--lime-ink)}
.tile.no{background:var(--bad-soft);color:var(--bad)}
.tile.warn{background:var(--warn-soft);color:var(--warn)}
.tile.dark{background:var(--ink);color:var(--bg)}
.tile.cal{background:var(--cal);color:#fff}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--card2);display:grid;place-items:center;font-size:12px;font-weight:600;flex:none}
.avatar.sm{width:28px;height:28px;font-size:10px}
.av-stack{display:flex}
.av-stack .avatar{border:2.5px solid var(--card);margin-left:-8px}
.av-stack .avatar:first-child{margin-left:0}
mark{background:var(--lime);color:var(--lime-ink);border-radius:4px;padding:0 3px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
input[type=text],input[type=number],textarea{width:100%;font-size:15px;background:var(--card);border:1.5px solid transparent;border-radius:16px;padding:14px 16px;transition:border-color .2s}
input:focus,textarea:focus{outline:none;border-color:var(--ink)}
textarea{min-height:200px;resize:vertical;line-height:1.55}
.field{display:flex;flex-direction:column;gap:8px}
.field > b{font-size:13px;font-weight:600}
.err{font-size:12px;color:var(--bad)}
.switch{appearance:none;-webkit-appearance:none;flex:none;width:44px;height:26px;border-radius:13px;background:var(--card2);position:relative;cursor:pointer;transition:background .25s;margin:0}
.switch::before{content:"";position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.2);transition:transform .32s var(--spring)}
.switch:checked{background:var(--lime)}
.switch:checked::before{transform:translateX(18px)}
.seg{position:relative;display:flex;background:var(--card);border-radius:999px;padding:4px}
.seg button{position:relative;z-index:1;flex:1;padding:10px 6px;border-radius:999px;font-size:13px;font-weight:500;color:var(--muted);transition:color .25s;white-space:nowrap}
.seg button[aria-selected="true"]{color:var(--ink)}
.seg .n{font-family:var(--f-mono);font-size:11px;margin-left:4px;opacity:.6}
.seg .ind{position:absolute;left:0;top:4px;bottom:4px;border-radius:999px;background:var(--bg);box-shadow:var(--shadow);transition:transform .45s var(--spring),width .45s var(--spring)}
.noanim .ind,.noanim .vind{transition:none!important}
.g2{display:grid;gap:22px;grid-template-columns:minmax(0,1fr)}
@media (min-width:1024px){.g2{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}}
.gside{display:grid;gap:22px;grid-template-columns:minmax(0,1fr)}
@media (min-width:900px){.gside{grid-template-columns:minmax(0,1fr) 340px;align-items:start}.gside > .aside{position:sticky;top:20px}}
@media (min-width:1024px){.gside{grid-template-columns:minmax(0,1fr) 380px}}
.rows{display:flex;flex-direction:column;gap:8px}
.lrow{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:20px;padding:10px 14px 10px 10px;text-align:left;width:100%;transition:transform .15s}
button.lrow:active{transform:scale(.985)}
.lrow > div{min-width:0;flex:1}
.lrow b{font-size:15px;font-weight:500;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow .sub{font-size:12px;color:var(--muted);display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.lrow .t{font-size:12px;color:var(--muted);white-space:nowrap}
.lrow > svg.chev{width:16px;height:16px;color:var(--muted);flex:none}
.sample{font-size:9px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 3px;margin-left:5px;font-weight:500;vertical-align:2px}
.ybar{display:flex;gap:10px;align-items:flex-start;background:var(--warn-soft);border-radius:18px;padding:12px 14px;font-size:14px}
.ybar .pill{background:#F6D23C;color:#1A1500;flex:none}
.empty{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;padding:40px 20px}

/* role cards */
.roles{display:grid;gap:10px;grid-template-columns:minmax(0,1fr)}
@media (min-width:700px) and (max-width:1023px){.roles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.role{display:flex;flex-direction:column;gap:12px;text-align:left;background:var(--card);border-radius:24px;padding:16px;transition:transform .2s var(--ease)}
.role:active{transform:scale(.98)}
.role h3{font-size:17px}
.funnel{display:flex;height:8px;border-radius:99px;overflow:hidden;gap:2px;background:var(--card2)}
.funnel i{display:block;height:100%;transition:width .9s var(--ease)}
.flegend{display:flex;gap:12px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.flegend span{display:inline-flex;gap:5px;align-items:center}
.flegend span::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c)}
.role.add{border:1.5px dashed var(--line);background:none;flex-direction:row;align-items:center}

/* pipeline */
.kseg{display:none}
.kan{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;align-items:start}
.kcol{display:flex;flex-direction:column;gap:10px;background:var(--card);border-radius:26px;padding:10px;min-width:0}
.kcol > header{display:flex;justify-content:space-between;align-items:center;padding:6px 8px 2px;font-size:14px;font-weight:600}
.kcol > header span{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-weight:500}
.kmore{font-size:12px;color:var(--muted);text-align:center;padding:4px}
@media (max-width:1023px){.kan{grid-template-columns:repeat(4,290px);overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding-bottom:4px}.kan::-webkit-scrollbar{display:none}.kcol{scroll-snap-align:start}}
@media (max-width:699px){.kseg{display:flex}.kan{display:block;overflow:visible}.kcol{display:none;background:none;padding:0}.kcol.on{display:flex}.kcol > header{display:none}}
.ccard{display:flex;flex-direction:column;gap:12px;text-align:left;width:100%;background:var(--bg);border-radius:20px;padding:14px;transition:transform .2s var(--ease)}
.ccard:active{transform:scale(.98)}
@media (max-width:699px){.ccard{background:var(--card);border-radius:24px;padding:16px}}
.ccard .name{font-size:16px;font-weight:600;letter-spacing:-.015em;line-height:1.2}
.ccard .role-t{font-size:12px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cfoot{display:flex;align-items:center;justify-content:space-between;gap:8px}
.orbs{display:flex;align-items:center}
.orbs i{width:18px;height:18px;border-radius:50%;background:var(--c);border:2.5px solid var(--bg);margin-left:-6px}
.orbs i:first-child{margin-left:0}
.orbs i.none{background:var(--card2)}
@media (max-width:699px){.orbs i{border-color:var(--card)}}
.score{font-size:30px;font-weight:300;letter-spacing:-.05em;line-height:1}
.score small{font-size:12px;color:var(--muted);letter-spacing:0;margin-left:2px}

/* candidate */
.ringwrap{display:grid;place-items:center}
.ring .fld{fill:var(--muted);opacity:.3}
.ring .dot{fill:var(--card2);transition:fill .3s}
.ring .dot.on{fill:var(--ink)}
.ring.lime .dot.on{fill:var(--good)}
.scoreblock{display:grid;grid-template-columns:auto minmax(0,1fr);gap:20px;align-items:center}
@media (max-width:699px){.scoreblock{grid-template-columns:1fr}}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (min-width:1024px){.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}}
.ctile{background:var(--card);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.ctile .v{font-size:22px;font-weight:500;letter-spacing:-.03em}
.ctile .v small{font-size:13px;color:var(--muted);font-weight:400}
.ctile .lab{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.ctile .lab i{width:7px;height:7px;border-radius:50%;background:var(--c);flex:none}
.timeline{display:flex;flex-direction:column}
.tl{display:grid;grid-template-columns:80px 1fr;gap:12px;position:relative;padding-bottom:20px}
.tl::before{content:"";position:absolute;left:91.25px;top:10px;bottom:-10px;border-left:1.5px dashed var(--line)}
.tl:last-child::before{display:none}
.tl .when{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding-top:3px;line-height:1.3}
.tl .when span{display:block;font-family:var(--f-mono);color:var(--ink);font-size:12px;letter-spacing:0;margin-top:2px;text-transform:none}
.tl .what{position:relative;padding-left:14px;display:flex;flex-direction:column;gap:6px}
.tl .what::before{content:"";position:absolute;left:-4px;top:6px;z-index:1;width:8px;height:8px;border-radius:50%;background:var(--c,var(--line));box-shadow:0 0 0 3px var(--bg)}
.tl .what.now::before{background:var(--lime);box-shadow:0 0 0 3px var(--bg);animation:nowpulse 1.6s ease-out infinite}
@keyframes nowpulse{0%{box-shadow:0 0 0 3px var(--bg),0 0 0 3px rgba(203,243,74,.7)}70%{box-shadow:0 0 0 3px var(--bg),0 0 0 11px rgba(203,243,74,0)}100%{box-shadow:0 0 0 3px var(--bg),0 0 0 3px rgba(203,243,74,0)}}
.stages i.now{animation:nowblink 1.6s ease-in-out infinite}
@keyframes nowblink{50%{opacity:.45}}
.tl .what.todo{color:var(--muted)}
.tl q{quotes:none;font-size:15px;line-height:1.5}
.src{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:5px}
.src svg{width:12px;height:12px}
.stages{display:flex;gap:4px}
.stages i{flex:1;height:5px;border-radius:99px;background:var(--card2)}
.stages i.done{background:var(--ink)}
.stages i.now{background:var(--lime)}

/* dark panel + swipe */
.panel{background:var(--hd);color:var(--hd-ink);border-radius:28px;padding:20px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.panel h3{font-size:21px;font-weight:600;letter-spacing:-.02em}
.panel p{font-size:13px;color:var(--hd-muted)}
.panel .btn{margin-top:10px}
.panel .btn.ghost{color:var(--hd-ink);margin-top:0}
@media (max-width:699px){
  .panel.fixm{position:fixed;left:0;right:0;bottom:0;z-index:30;border-radius:30px 30px 0 0;padding:18px var(--gr) calc(18px + env(safe-area-inset-bottom,0px)) var(--gl);box-shadow:0 -10px 40px rgba(0,0,0,.18)}
  .has-panel{padding-bottom:210px}
}
.track{position:relative;width:100%;height:56px;margin-top:12px;display:flex;align-items:center;justify-content:space-between;touch-action:none}
.end{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;flex:none;transition:transform .2s var(--ease),box-shadow .2s}
.end svg{width:20px;height:20px}
.end.no{background:rgba(255,255,255,.12);color:#fff}
.end.yes{background:var(--lime);color:var(--lime-ink)}
.end:active{transform:scale(.92)}
.end.hot{transform:scale(1.12)}
.end.yes.hot{box-shadow:0 0 0 6px rgba(203,243,74,.25)}
.end.no.hot{box-shadow:0 0 0 6px rgba(255,255,255,.12)}
.tdots{flex:1;display:flex;justify-content:space-evenly;align-items:center;padding:0 10px}
.tdots i{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.28);transition:background .15s,transform .15s}
.tdots i.l{background:#fff;transform:scale(1.3)}
.tdots i.y{background:var(--lime);transform:scale(1.3)}
.knob{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;background:#fff;color:#0B0B0C;display:grid;place-items:center;cursor:grab;box-shadow:0 6px 18px rgba(0,0,0,.35);transition:transform .5s var(--spring)}
.knob.drag{transition:none;cursor:grabbing}
.knob svg{width:22px;height:22px}

/* actions bar */
.actions{display:flex;gap:10px;justify-content:flex-end;align-items:center}
@media (max-width:699px){
  .actions{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:24px var(--gr) calc(14px + env(safe-area-inset-bottom,0px)) var(--gl);background:linear-gradient(to top,var(--bg) 72%,transparent)}
  .actions .btn{flex:1;padding:17px;border-radius:20px}
  .has-actions{padding-bottom:110px}
}

/* create job */
.sdots{display:flex;gap:6px}
.sdots i{width:7px;height:7px;border-radius:99px;background:var(--line);transition:width .45s var(--spring),background .3s}
.sdots i.on{width:22px;background:var(--ink)}
.sdots i.done{background:var(--ink)}
.desc{font-size:16px;line-height:1.7}
.desc mark.flag{background:var(--bad-soft);color:var(--bad);text-decoration:underline wavy;text-underline-offset:4px;cursor:pointer}
.desc .fixed{background:var(--good-soft);border-radius:4px;padding:0 3px;transition:background 1.4s}
.frow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:center;background:var(--card);border-radius:20px;padding:14px 16px}
.frow s{color:var(--muted)}
.ko{display:flex;flex-direction:column;gap:10px;background:var(--card);border-radius:22px;padding:14px 16px;transition:opacity .25s}
.ko.off{opacity:.55}
.ko-top{display:flex;align-items:center;gap:12px}
.ko-top b{font-size:15px;font-weight:500;flex:1}
.cutbar{height:6px;border-radius:99px;background:var(--bg);overflow:hidden}
.cutbar i{display:block;height:100%;border-radius:99px;background:var(--ink);transition:width .7s var(--spring)}
.kototal{display:flex;flex-direction:column;gap:6px;background:var(--hd);color:var(--hd-ink);border-radius:26px;padding:20px}
.kototal p{color:var(--hd-muted);font-size:14px}
.kototal .hero-num small{color:var(--hd-muted)}
.kototal p.hero-num{font-size:56px;color:var(--hd-ink);margin:2px 0}
.chan{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.chan label{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--card);border-radius:18px;padding:14px;font-size:14px;font-weight:500;cursor:pointer}
.jobprev{background:var(--bg);border:1.5px solid var(--card2);border-radius:26px;padding:20px;display:flex;flex-direction:column;gap:14px}
.howcard{background:var(--blue);color:#fff;border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:10px}
.howcard p{font-size:14px;color:rgba(255,255,255,.92)}
.howcard b{color:#fff;font-weight:500}
.howcard .pill{background:rgba(0,0,0,.24);color:#fff}

/* schedule */
.days{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.day{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px;border-radius:18px;background:var(--card);border:1.5px solid transparent;transition:background .2s,border-color .2s,transform .15s}
.day:active{transform:scale(.95)}
.day b{font-size:22px;font-weight:500;letter-spacing:-.03em}
.day span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.day em{font-style:normal;font-size:11px;color:var(--muted)}
.day[aria-pressed="true"]{background:var(--bg);border-color:var(--ink)}
.day[aria-pressed="true"] b::after{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;background:#FF5A4E;margin-left:3px;vertical-align:super}
.slots{display:flex;flex-wrap:wrap;gap:8px}
.person{display:flex;align-items:center;gap:10px;padding:8px 14px 8px 8px;border-radius:999px;border:1.5px solid var(--line);background:var(--bg);transition:background .22s,color .22s,border-color .22s,transform .15s;font-size:14px;font-weight:500}
.person:active{transform:scale(.96)}
.person .avatar{width:30px;height:30px;font-size:11px}
.person[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.person[aria-pressed="true"] .avatar{background:var(--lime);color:var(--lime-ink)}
.calcard{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:22px;padding:14px}
.calcard .tile.cal{width:52px;height:52px;border-radius:15px;flex-direction:column;gap:0;font-weight:600}
.calcard .tile.cal small{font-size:9px;text-transform:uppercase;letter-spacing:.06em;opacity:.85}
.calcard .tile.cal b{font-size:20px;line-height:1}

/* scorecard */
.srow{display:flex;flex-direction:column;gap:12px;background:var(--card);border-radius:22px;padding:14px}
.srow-top{display:flex;align-items:center;gap:12px}
.srow-top b{font-size:15px;font-weight:500;flex:1}
.rate{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.rate button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px;border-radius:14px;background:var(--bg);font-size:18px;font-weight:500;transition:background .2s,color .2s,transform .15s}
.rate button small{font-size:10px;color:var(--muted);font-weight:500;transition:color .2s}
.rate button:active{transform:scale(.94)}
.rate button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.rate button[aria-pressed="true"] small{color:var(--bg);opacity:.7}
.locked{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:20px;padding:12px 14px}
.skel{flex:1;display:flex;flex-direction:column;gap:6px}
.skel i{display:block;height:8px;border-radius:99px;background:var(--card2)}
.revealed{display:flex;flex-direction:column;gap:10px;background:var(--card);border-radius:22px;padding:14px}
.dots4{display:inline-flex;gap:3px}
.dots4 i{width:8px;height:8px;border-radius:50%;background:var(--card2)}
.dots4 i.on{background:var(--ink)}

/* debrief matrix */
.matrix{overflow-x:auto;background:var(--card);border-radius:24px}
.matrix table{width:100%;border-collapse:collapse;min-width:520px;font-size:14px}
.matrix th{font-size:12px;font-weight:500;color:var(--muted);text-align:left;padding:14px 12px 8px}
.matrix td{padding:12px;border-top:1px solid var(--card2);vertical-align:middle}
.matrix th:first-child,.matrix td:first-child{padding-left:16px}
.matrix .who{display:flex;flex-direction:column;align-items:flex-start;gap:6px}

/* offer */
.band{display:flex;flex-direction:column;gap:14px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:36px;background:none;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:10px;border-radius:99px;background:linear-gradient(90deg,var(--ink) var(--p,50%),var(--card2) var(--p,50%))}
input[type=range]::-moz-range-track{height:10px;border-radius:99px;background:var(--card2)}
input[type=range]::-moz-range-progress{height:10px;border-radius:99px;background:var(--ink)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;border-radius:50%;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.25);margin-top:-10px;cursor:grab}
input[type=range]::-moz-range-thumb{width:30px;height:30px;border:0;border-radius:50%;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.25);cursor:grab}
.bandlbl{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.approve{display:flex;flex-direction:column}
.ap{display:flex;gap:12px;align-items:center;position:relative;padding-bottom:18px}
.ap::before{content:"";position:absolute;left:17px;top:36px;bottom:0;border-left:1.5px dashed var(--line)}
.ap:last-child::before{display:none}
.ap .st{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--card2);flex:none;transition:background .35s,color .35s,transform .35s var(--spring)}
.ap .st svg{width:16px;height:16px}
.ap.done .st{background:var(--lime);color:var(--lime-ink)}
.ap.busy .st{background:var(--ink);color:var(--bg);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.1)}}

/* screening module (ported from Shortlist Lens) */
.crit{background:var(--card);border-radius:22px;padding:12px;display:flex;flex-direction:column;gap:12px}
.crit-top{display:flex;align-items:center;gap:12px}
.crit-top b{font-size:15px;font-weight:600;display:block}
.crit .chip{padding:7px 12px;font-size:13px;border-width:0;background:var(--bg)}
.crit .chip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.crit-top .epill{margin-left:auto;padding:6px 12px;border-radius:999px;background:var(--bg);font-size:13px;font-weight:500;transition:transform .15s}
.crit-top .epill:active{transform:scale(.94)}
.crit.off .crit-top{opacity:.45}
.addc{display:flex;align-items:center;gap:12px;width:100%;padding:12px;border-radius:22px;border:1.5px dashed var(--line);font-size:15px;font-weight:500;text-align:left;transition:transform .15s}
.addc:active{transform:scale(.98)}
.addc .tile{background:var(--ink);color:var(--bg);font-size:22px;font-weight:300}
.chip.addx{width:40px;height:40px;padding:0;display:grid;place-items:center;background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.addx svg{width:16px;height:16px}
button.chip.lock{cursor:pointer}
.ranges{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.ranges div{background:var(--card);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.ranges b{font-size:26px;font-weight:300;letter-spacing:-.04em;line-height:1.1}
.note{display:flex;gap:8px;align-items:center;font-size:13px}
.hint{font-size:12px;color:var(--muted);margin-right:auto}
@media (max-width:699px){.actions .hint{display:none}}
.iconbtn{width:38px;height:38px;border-radius:50%;background:var(--card);display:grid;place-items:center;flex:none;transition:transform .15s}
.iconbtn:active{transform:scale(.92)}
.iconbtn svg{width:16px;height:16px}
.ed-top{display:flex;align-items:center;justify-content:space-between}
.ed-view{display:flex;flex-direction:column;gap:16px}
.tgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tcard{display:flex;flex-direction:column;gap:10px;align-items:flex-start;background:var(--card);border-radius:20px;padding:12px;text-align:left;font-size:14px;font-weight:500;transition:transform .15s}
.tcard:active{transform:scale(.97)}
.tcard[disabled]{opacity:.4;cursor:not-allowed}
.tcard.own{grid-column:1/-1;flex-direction:row;align-items:center;border:1.5px dashed var(--line);background:none}
.kw{display:inline-flex;align-items:center;gap:6px;background:var(--card);border-radius:999px;padding:7px 8px 7px 13px;font-size:14px}
.kw button{width:20px;height:20px;border-radius:50%;background:var(--card2);display:grid;place-items:center}
.kw button svg{width:10px;height:10px}
.kwadd{display:flex;gap:8px}
.kwadd input{flex:1;min-width:0}
.kwadd .btn{padding:0 16px;border-radius:16px}
.stepper{display:flex;align-items:center;justify-content:space-between;background:var(--card);border-radius:24px;padding:10px}
.stepper button{width:52px;height:52px;border-radius:50%;background:var(--bg);font-size:26px;font-weight:300;transition:transform .15s}
.stepper button:active{transform:scale(.92)}
.stepper .num{font-size:52px;font-weight:300;letter-spacing:-.05em;line-height:1}
.stepper .num small{font-size:15px;color:var(--muted);letter-spacing:0;margin-left:3px}
.prev{display:flex;align-items:center;gap:10px;font-size:14px}
.prev .avatar{width:32px;height:32px;font-size:11px;background:var(--card)}
.prev .pbar{flex:1;height:6px;border-radius:99px;background:var(--card);overflow:hidden}
.prev .pbar i{display:block;height:100%;background:var(--ink);border-radius:99px;transition:width .5s var(--spring)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--bad-soft);border-radius:16px;padding:10px 12px;font-size:13px}
.confirm span{flex:1;min-width:150px}
.sheet.ed{min-height:min(640px,86vh)}
.cand{display:flex;flex-direction:column;gap:12px;text-align:left;width:100%;background:var(--card);border-radius:24px;padding:16px;transition:transform .2s var(--ease)}
.cand:active{transform:scale(.98)}
.cand .name{font-size:17px;font-weight:600;letter-spacing:-.015em;line-height:1.2}
.cand .role-t{font-size:13px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cand .orbs i{border-color:var(--card)}
.slist{display:grid;gap:10px;grid-template-columns:minmax(0,1fr)}
@media (min-width:900px){.slist{grid-template-columns:repeat(2,minmax(0,1fr))}}
.more{font-size:13px;color:var(--muted);text-align:center;padding:4px;grid-column:1/-1}
.hscroll{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding:2px 0 4px}
.hscroll::-webkit-scrollbar{display:none}
@media (max-width:699px){.hscroll{margin:0 calc(-1*var(--gr)) 0 calc(-1*var(--gl));padding:2px var(--gr) 4px var(--gl)}}
.rcard{flex:none;width:180px;scroll-snap-align:start;background:var(--card);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:14px;cursor:pointer}
.rcard .top{display:flex;justify-content:space-between;align-items:center}
.rcard b{font-size:14px;font-weight:500;line-height:1.3}
.stats3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stats3 div{background:var(--card);border-radius:18px;padding:12px;min-width:0}
.stats3 b{display:block;font-size:30px;font-weight:300;letter-spacing:-.05em;line-height:1.05;margin-top:6px}
.insight{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:22px;padding:14px;text-align:left;width:100%;transition:transform .15s}
.insight:active{transform:scale(.98)}
.center{position:absolute;left:50%;top:50%;width:min(360px,calc(100% - 32px));background:var(--bg);border-radius:32px;padding:26px 22px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;transform:translate(-50%,-44%) scale(.94);opacity:0;transition:transform .45s var(--spring),opacity .3s}
.layer.open .center{transform:translate(-50%,-50%) scale(1);opacity:1}
.flagcount{background:var(--bad-soft);color:var(--bad)}

/* single-line buttons */
.btn{white-space:nowrap;min-width:0}
.btn .bl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.gpill,.person{white-space:nowrap}
.chip{white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.chip.wrap{white-space:normal;text-align:left;overflow:visible}
.topnav{flex-wrap:wrap}
.topnav > .row{flex-wrap:wrap;justify-content:flex-end;gap:6px}
.htag{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;border:1px solid rgba(255,255,255,.24);color:var(--hd-ink);font-size:13px;font-weight:500;white-space:nowrap}
.htag svg{width:14px;height:14px}

/* chrome */
.nav .badge{margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--lime);color:var(--lime-ink);font-size:11px;font-weight:600;display:grid;place-items:center}
@media (max-width:1023px){.nav .badge{position:absolute;top:4px;right:6px;min-width:16px;height:16px;font-size:10px;padding:0 4px}}
.tabbar .badge{position:absolute;top:8px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--lime);font-size:0;padding:0;overflow:hidden}
.cvbtn.rec{background:var(--ink);color:var(--bg)}
.me button{display:flex;gap:10px;align-items:center;text-align:left;width:100%;min-width:0}
.me .sub{text-decoration:underline;text-underline-offset:2px}
.jseg{display:inline-flex;background:var(--card);border-radius:999px;padding:3px;margin-right:6px;flex:none;gap:2px}
.journey .jseg button{background:none;padding:5px 11px}
.journey .jseg button[aria-current="true"]{background:var(--ink);color:var(--bg)}
.cvbar{flex-wrap:wrap}
.cvbar > span{min-width:0}

/* candidate side */
.udot{width:9px;height:9px;border-radius:50%;background:var(--good);flex:none;box-shadow:0 0 0 0 rgba(34,164,93,.5);animation:udot 1.8s ease-out infinite}
.qacard{text-align:left;width:100%;cursor:pointer;transition:transform .2s cubic-bezier(.2,.8,.2,1)}.qacard:active{transform:scale(.98)}
.qaclip{min-width:0;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.qathread{display:flex;flex-direction:column;gap:10px;margin:14px 0 18px}
.qab{max-width:85%;padding:12px 14px;border-radius:18px 18px 18px 6px;background:var(--card);display:flex;flex-direction:column;gap:4px}
.qab p{margin:0;font-size:15px;line-height:1.4}

/* onboarding fits the viewport: no page scroll */
html:has(.view.intro),body:has(.view.intro){overflow:hidden}.main:has(.view.intro){padding:16px!important;position:fixed;inset:0;height:auto;overflow:hidden;display:flex;flex-direction:column;max-width:none}
.main:has(.view.intro)>#view{flex:1;min-height:0;min-width:0;width:100%;display:flex}
.view.intro{flex:1;min-height:0;min-width:0;width:100%;display:flex;align-items:center;justify-content:center;margin:0;padding:0}
.view.intro .itr{margin:0 auto!important;min-height:0!important;height:100%;max-height:760px}
.view.intro .ivp,.view.intro .itrack,.view.intro .islide{min-height:0}
.view.intro .islide .scn{min-height:0;max-height:100%}
@media (max-width:699px){.main:has(.view.intro){padding:0!important}.view.intro .itr{max-height:none}}
#journey{display:none!important}.me .protok{width:34px;height:34px;flex:none;margin-left:0;display:grid;place-items:center;padding:0;gap:0}.me button:first-child{flex:1}@media (max-width:1023px){.me{flex-direction:column;gap:6px}}@media (min-width:700px){.protom{display:none!important}}@media (max-width:699px){.me .protok{display:none}}
.rdgrip{width:28px;height:32px;margin-left:-6px;border-radius:8px;display:grid;place-items:center;color:var(--muted);cursor:grab;touch-action:none;flex:none}.rdgrip:hover{background:var(--bg);color:var(--ink)}.rdgrip svg{width:18px;height:18px}.rdcard.dragging{position:relative;z-index:5;box-shadow:0 16px 40px rgba(0,0,0,.22);cursor:grabbing}.rdcard.dragging .rdgrip{cursor:grabbing}#rdList.sorting .rdcard>:not(:first-child){display:none}#rdList.sorting .rdcard{padding:10px 16px}.rdname{display:none}#rdList.sorting .rdname{display:inline}#rdList.sorting .rdcard [data-act="rdel"]{visibility:hidden}body.nosel{user-select:none;-webkit-user-select:none;cursor:grabbing}
@media (prefers-color-scheme: dark){html.ios:not([data-theme="light"]) .pop{background:rgba(40,40,42,.9)}}html.ios[data-theme="dark"] .pop{background:rgba(40,40,42,.9)}
.critflag{display:flex;gap:10px;align-items:flex-start;background:var(--bad-soft);border-radius:14px;padding:10px 12px;margin-top:10px;font-size:13px}.critflag>svg{width:16px;height:16px;color:var(--bad);flex:none;margin-top:2px}.critflag b{display:block;font-weight:600}.critflag span{display:block}.critflag[hidden]{display:none}
.fairflag{display:flex;flex-direction:column;gap:6px;background:var(--bad-soft);border-radius:14px;padding:12px}
.aicard p{line-height:1.5}
/* intro */
.view.intro{padding:0}
.itr{position:relative;width:100%;max-width:460px;margin:2vh auto 0;background:#0B0B0C;color:#fff;border-radius:32px;padding:16px 16px 20px;overflow:hidden;display:flex;flex-direction:column;gap:14px;min-height:min(720px,calc(100vh - 120px));box-shadow:0 30px 60px rgba(0,0,0,.18)}
.itop{display:flex;align-items:center;gap:12px;transition:opacity .35s,transform .45s var(--spring)}
.ibars{flex:1;display:flex;gap:5px}
.ibars i{flex:1;height:3px;border-radius:3px;background:rgba(255,255,255,.18);overflow:hidden}
.ibars b{display:block;height:100%;width:0;background:#fff;border-radius:3px}
.iskip{color:rgba(255,255,255,.6);font-size:14px;padding:6px 4px;white-space:nowrap}
.ivp{flex:1;overflow:hidden;touch-action:pan-y;user-select:none;-webkit-user-select:none;display:flex}
.itrack{display:flex;width:100%;flex:1}
.islide{flex:0 0 100%;min-width:0;display:flex;flex-direction:column;gap:22px}
.itxt h1{font-size:30px;line-height:1.05;letter-spacing:-.03em;font-weight:600;margin:0}
.itxt p{margin:8px 0 0;color:rgba(255,255,255,.62);font-size:16px}
.ibtm{display:flex;justify-content:flex-end;transition:opacity .35s,transform .45s var(--spring)}
.ibtm .btn{min-width:120px}
.itr.end .itop,.itr.end .ibtm{opacity:0;transform:translateY(-10px);pointer-events:none}
.itr.end .ibtm{transform:translateY(10px);height:0;margin-top:-14px}
.idoors{justify-content:center;gap:18px;padding:8px 2px}
.itr>*,.ivp,.itrack{min-width:0;max-width:100%}.ivp{width:100%}
.idoors h1.big{color:#fff;white-space:normal;overflow-wrap:anywhere;font-size:clamp(34px,9vw,46px);line-height:1.02}
.idoors .door{min-width:0}
.idoors .door.dark{background:#1F1F22}
.ireplay{align-self:center;display:inline-flex;align-items:center;gap:6px;color:rgba(255,255,255,.6);font-size:14px}
.ireplay svg{width:16px;height:16px}
.scn{position:relative;flex:1;min-height:300px;border-radius:26px;background:#161618;overflow:hidden;color:#fff}
.scn .avatar{border:0;margin:0;background:var(--lime);color:#111}
/* s1 */
.s1 .cnt{position:absolute;left:18px;top:16px;display:flex;align-items:baseline;gap:8px}
.s1 .cnt b{font-size:40px;font-weight:600;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.s1 .cnt span{color:rgba(255,255,255,.55);font-size:13px}
.s1 .pile{position:absolute;left:50%;top:44%;width:0;height:0}
.cv{position:absolute;left:0;top:-48px;width:74px;height:96px;border-radius:12px;background:#2A2A2E;border:1.5px solid rgba(255,255,255,.08);padding:10px 9px;display:flex;flex-direction:column;gap:6px;transition:border-color .4s,background .4s;box-shadow:0 8px 20px rgba(0,0,0,.35)}
.cv u{width:18px;height:18px;border-radius:50%;background:rgba(255,255,255,.22);margin-bottom:2px}
.cv s{height:5px;border-radius:3px;background:rgba(255,255,255,.14)}.cv s:nth-of-type(2){width:70%}.cv s:nth-of-type(3){width:45%}
.cv.g{border-color:var(--lime);background:#2D3320}.cv.y{border-color:#FFC23D;background:#33301F}.cv.r{border-color:rgba(255,255,255,.18);background:#222225}
.s1 .scan{position:absolute;left:16%;right:16%;top:22%;height:2px;background:var(--lime);box-shadow:0 0 18px 4px rgba(203,243,74,.55);border-radius:2px;opacity:0}
.s1 .lanes{position:absolute;left:0;right:0;bottom:14px;display:grid;grid-template-columns:repeat(3,1fr);text-align:center;opacity:0;transform:translateY(10px);transition:opacity .5s,transform .6s var(--spring)}

function ringSVG(n,size,cls=''){const c=size/2,R=size*0.31;let s=`<svg class="ring ${cls}" viewBox="0 0 ${size} ${size}" style="width:${size}px;height:${size}px;max-width:100%" aria-hidden="true">`;
  for(let x=5;x<size;x+=9)for(let y=5;y<size;y+=9){const d=Math.hypot(x-c,y-c);if(d<c-3&&(d>R+10||d<R-10))s+=`<circle class="fld" cx="${x}" cy="${y}" r="1.1"/>`;}
  for(let i=0;i<n;i++){const a=(-90+i*360/n)*Math.PI/180;s+=`<circle class="dot" data-i="${i}" cx="${(c+R*Math.cos(a)).toFixed(2)}" cy="${(c+R*Math.sin(a)).toFixed(2)}" r="3.4"/>`;}
  return s+'</svg>';}
function fillRing(root,k,stagger){root.querySelectorAll('.dot').forEach(d=>{const i=+d.dataset.i;d.style.transitionDelay=stagger?(i*18)+'ms':'0ms';d.classList.toggle('on',i<k);});}
function countUp(el,to,dur=900){if(REDUCE){el.textContent=to;return;}const t0=performance.now();const st=t=>{const p=Math.min(1,(t-t0)/dur);el.textContent=Math.round(to*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(st);};requestAnimationFrame(st);}
function placeInd(box,selr,indSel,vertical){if(!box)return;const s=box.querySelector(selr);const ind=box.querySelector(indSel);if(!ind)return;if(!s){ind.style.opacity=0;return;}ind.style.opacity=1;
  if(vertical){ind.style.height=s.offsetHeight+'px';ind.style.transform=`translateY(${s.offsetTop}px)`;}
  else{if(box.classList.contains('seg'))ind.style.width=s.offsetWidth+'px';const dx=box.id==='tabbar'?(s.offsetWidth-ind.offsetWidth)/2:0;ind.style.transform=`translateX(${s.offsetLeft+dx}px)`;}

/* criteria block */
/* criteria that are not job-related, or stand in for a protected trait, get flagged before anyone is screened */
/* Criteria check, modelled on job-ad bias checkers.
   NOT ALLOWED: the criterion names a protected ground directly. It can't be kept, only edited or deleted.
   CHECK: the criterion is a proxy that tends to screen out a group. It can be kept with a reason, and that is logged. */
const CBLOCK=[
  [/\b(race|racial|ethnic\w*|caucasian|aryan|dravidian|skin|complexion|fair[- ]skinned|wheatish|(white|black|brown|asian|african|european)[- ]?(people|person|persons|only|candidates?|applicants?|men|women|folks?))\b|\bonly (white|black|brown|asian|fair)\b/,'race, skin colour or ethnicity'],
  [/\b(caste|jati|brahmin\w*|upper[- ]caste|general category|obc|sc\/st|dalit\w*|surname)\b/,'caste'],
  [/\b(religio\w*|faith|hindu\w*|muslim\w*|christian\w*|sikh\w*|jain\w*|buddhist\w*|jewish|parsi|church|temple|mosque)\b/,'religion'],
  [/\b(male|female|males|females|man|men|woman|women|girls?|boys?|gender|lad(y|ies)|gentlem[ae]n|he\/him|she\/her)\b/,'sex or gender'],
  [/\b(gay|lesbian|straight|heterosexual|lgbt\w*|queer|transgender|trans|cisgender|sexual orientation)\b/,'sexual orientation or gender identity'],
  [/\b(married|unmarried|single|spouse|bachelor|spinster|no kids|children|pregnan\w*|family planning|maternity)\b/,'marital status, pregnancy or family'],
  [/\b(under|below|above|over|max(imum)?|min(imum)?)\s*(age\s*)?\d{2}\s*(years old|yrs old|yo)?\b(?!\s*\+?\s*(years|yrs)\s+(of\s+)?(experience|exp))|\b(age|aged|years old|born (in|after|before))\b/,'age'],
  [/\b(disab\w*|able[- ]bodied|handicap\w*|healthy|physically fit|no medical|wheelchair)\b/,'disability or health'],
  [/\b(nationality|citizen\w*|born in|native of|domicile|place of birth|(north|south) indian|locals? only|from (bihar|up|kerala|tamil nadu|the north|the south|the northeast))\b/,'nationality, birthplace or region'],
  [/\b(good[- ]looking|attractive|presentable|pleasant personality|height|weight|slim|photo)\b/,'appearance']];
const CFLAG=[[/\b(college|university|iit|iim|nid|tier[- ]?1|degree from|alma mater|premier institute)\b/,'college stands in for background and money, not skill'],
  [/\b(native|mother tongue|accent|fluent english|convent)\b/,'language or accent screens people out by where they grew up'],
  [/\b(young|youthful|fresh(er)?|recent grad\w*|digital native|energetic|high energy|overqualified)\b/,'reads as an age preference'],
  [/\b(no gaps?|career gaps?|continuous employment|unbroken)\b/,'gaps often mean caregiving or health, so this penalises them'],
  [/\b(culture fit|vibe|personality|attitude|like us)\b/,'not measurable from a résumé, and it invites bias'],
  [/\b(faang|big tech|top compan\w*|brand name|mnc)\b/,'employer brand stands in for access, not skill'],
  [/\b(rockstar|ninja|guru|dominant|aggressive|competitive|fearless)\b/,'male-coded wording, which puts off women applicants'],
  [/\b(own (a )?(vehicle|bike|car|laptop)|two[- ]wheeler|lives? (near|within)|nearby)\b/,'stands in for money or where someone lives']];

function critHard(c){const t=critText(c);return CBLOCK.filter(([re])=>re.test(t)).map(([,m])=>m);}
function critFlags(c,j){const t=critText(c);const f=CFLAG.filter(([re])=>re.test(t)).map(([,m])=>m);
  const m=t.match(/(\d+)\s*\+?\s*(years|yrs)/);if(m&&j){const mx=expOf(j)[1];if(mx<40&&+m[1]>mx+1)f.push(`asks for ${m[1]}+ years, but the role is ${j.exp}`);}return f;}

function fbSay(x){const n=state.fbSel.length;if(state.fbAll&&state.fbFor===x.id)return `<span class="inav">${initials(x.name)}</span> <b>${first(x.name)}</b> met <b>every requirement</b>. Say what the decision really came down to.`;return `<b>${n} ${n===1?'reason':'reasons'}</b> for <span class="inav">${initials(x.name)}</span> <b>${first(x.name)}</b>${x.stage==='debrief'?` after ${rlab(x).toLowerCase()}`:''}. No scores.`;}
R.feedback=()=>{const x=sel();
  const def=x.stage==='debrief'&&x.cards?SCR(x).filter(c=>{const v=x.interview.panel.map(p=>(x.cards[p]||{r:{}}).r[c.k]||0);return v.reduce((a,b)=>a+b,0)/v.length<2.75;}).map(c=>c.k):SC().filter(c=>stat(pts(x,c),c.max)!=='met').map(c=>c.k);
  if(!(state.fbSel&&state.fbFor===x.id)){state.fbSel=def;state.fbEdited=false;state.fbDraft='';state.fbAll=!def.length;state.fbWhy=({farah:'filled',g5:'closed'})[x.id]||null;state.fbWhyX=null;state.fbCrit=false;}state.fbFor=x.id;
  const text=state.fbEdited&&state.fbDraft?state.fbDraft:fbFor(x,state.fbSel);
  return `<section class="view has-head has-actions"><div class="head blue">
    <div class="topnav"><button class="cbtn" data-act="go" data-v="cand" aria-label="Back"><svg><use href="#i-back"/></svg></button><div class="row nowrap"><span class="htag">Draft</span><button class="gpill" data-act="mode">${ic('i-eye')}Preview</button></div></div>
    <p class="say" id="fbSay" style="color:rgba(255,255,255,.86)">${fbSay(x)}</p>
</div>
  <div class="body"><div class="gside">
    <div class="stack" style="gap:16px">
      ${state.fbAll?whyPick(x):''}<h2 class="tt" ${state.fbAll?'style="display:none"':''}>Reasons</h2>
      <div class="hscroll" style="margin-top:-6px${state.fbAll?';display:none':''}">${SC().map(c=>{const s=stat(pts(x,c),c.max);return `<label class="rcard st"><span class="top"><span class="tile" style="width:34px;height:34px;border-radius:11px">${ic(c.icon)}</span><input type="checkbox" class="switch" data-fb="${c.k}" ${state.fbSel.includes(c.k)?'checked':''} aria-label="Mention ${esc(c.name)}"></span><b>${esc(c.name)}</b>${pill(STAT[s][0],STAT[s][1])}</label>`;}).join('')}</div>
      <label for="fbText" class="tt">Message</label>
      <textarea id="fbText" style="margin-top:-8px;min-height:260px">${esc(text)}</textarea><div id="fbLintW" aria-live="polite">${fbLintHTML(x,text)}</div><p class="xs muted fbto">${ic('i-mail')}Goes to ${esc(emailOf(x))} and ${esc(first(x.name))}’s Lens messages.</p>
    </div>
    <div class="aside stack"><div class="card stack"><b class="small">Check against</b><div class="chips">${docBtns(x)}</div></div><div class="card stack"><b class="small">Never included</b>${['Scores or ranking','Anything from the never-scored list','Comparisons with other applicants','Interviewers’ written notes','Opinions about personality or “fit”'].map(t=>`<p class="small muted" style="display:flex;gap:8px;align-items:center">${ic('i-lock')}${t}</p>`).join('')}</div></div>
  </div></div>
  <div class="actions"><button class="btn primary" data-act="fbsend">${ic('i-send')}Send feedback</button></div></section>`;};

/* schedule */
R.schedule=()=>{const x=sel(),s=state.sched,fn=first(x.name);
  const adv=x.stage==='debrief'&&!lastRound(x);if(x.stage!=='screen'&&!adv)return emptyView(`Nothing to book for ${fn}`,'Rounds are booked from screening, or after a debrief moves someone on.','cand','Back to candidate');

    <p class="say">Book <span class="inav">${initials(x.name)}</span> <b>${fn}</b> for <span class="ipill">${rlab(x,ni)} · ${esc(nr.name)}</span><span class="saymore"> · ${s.panel.length} ${s.panel.length===1?'person':'people'} · ${s.len} min</span> · <b>${s.self?`${wk} time${wk===1?'':'s'} to offer`:s.slot?slotLabel(s.slot):'pick a time'}</b></p></div>
  <div class="body"><div class="gside">
    <div class="stack" style="gap:20px">
      <div class="field"><b>Panel</b><div class="chips">${Object.keys(P).map(p=>`<button class="person" data-act="panel" data-p="${p}" aria-pressed="${s.panel.includes(p)}"><span class="avatar">${initials(P[p].n)}</span>${first(P[p].n)} <span class="xs" style="opacity:.6">${P[p].r}${P[p].tz!=='IST'?' · '+P[p].tz:''}</span></button>`).join('')}</div>${calSync(s.panel)}</div>
      <div class="field"><b>Length</b>${lenPick(s.len,(roundOf(x).kind==='call'?[15,20,30,45]:[30,45,60]),'len',null,'sched')}</div>

      ${s.self?`${dayRow('day',s,s.panel,s.len,{ro:true,sel:s.day})}<span class="xs muted" style="margin-top:-12px">All ${wk} free time${wk===1?'':'s'} go in the link. Tap a day to see them. ${first(x.name)} picks one.</span>${s.len>60?`<p class="xs muted">Only times where everyone is free for the full ${s.len} min, ending by ${DAY_END}:00.</p>`:''}`
      :`${dayRow('day',s,s.panel,s.len,{sel:s.day})}
      <div class="slots">${slots.length?slots.map(h=>`<button class="chip" data-act="slot" data-h="${h}" aria-pressed="${!!(s.slot&&s.slot.d===s.day&&s.slot.h===h)}">${tr(h,s.len)}${s.panel.filter(p=>P[p].tz!=='IST').map(p=>`<small class="tzs">${inTz(h,P[p].tz)} ${P[p].tz}</small>`).join('')}</button>`).join(''):'<span class="small muted">No common time this day for ${s.len} min. Try another day, a shorter length or a different panel.</span>'}</div>${s.len>60?`<p class="xs muted">Only times where everyone is free for the full ${s.len} min, ending by ${DAY_END}:00.</p>`:''}`}
    </div>
    <div class="aside"><div class="howcard"><span class="pill" style="align-self:flex-start">${ic('i-eye')}What ${fn} gets</span><p>${adv?`<b>“You're through to round ${ni+1}.”</b> `:''}${s.self?`<b>A booking link with ${wk} time${wk===1?'':'s'}</b> across the week. ${fn} picks one.`:`<b>An invite for ${slotLabel(s.slot)||'your pick'}.</b>`} Plus what ${esc(nr.name.toLowerCase())} is, who they'll meet and how to prepare.</p></div></div>
  </div></div>
  <div class="actions"><button class="btn primary" data-act="book" ${soft(can)}>${s.self?ic('i-link')+bl('Send booking link'):ic('i-send')+bl('Send invite')}</button></div></section>`;};

/* scorecard */
R.score=()=>{const x=sel(),fn=first(x.name),iv=x.interview,me=state.me;
  if(!iv)return emptyView('No interview yet',`${fn} hasn't been moved to interview.`,'cand','Back to candidate');
  if(!iv.slot)return emptyView(`Waiting for ${fn} to book`,'The scorecard opens once the interview is on the calendar.','cand','Back to candidate');
  x.cards=x.cards||{};const missing=iv.panel.filter(p=>!x.cards[p]);const sc=state.score;const onPanel=iv.panel.includes(me);
  const card=p=>{const cd=x.cards[p];return `<div class="revealed st"><div class="row between nowrap"><span class="row nowrap"><span class="avatar">${initials(P[p].n)}</span><span><b style="font-weight:500">${P[p].n}</b>${p===me?' <span class="pill lime">You</span>':''}<span class="xs muted" style="display:block">${P[p].r}</span></span></span><span class="pill ${cd.rec>=2?'lime':'grey'}">${REC[cd.rec]}</span></div>
      <div class="tiles">${SCR(x).map(c=>`<div class="ctile" style="background:var(--bg)"><span class="lab">${esc(c.short||c.name)}</span><span class="dots4">${[1,2,3,4].map(n=>`<i class="${n<=(cd.r[c.k]||0)?'on':''}"></i>`).join('')}</span></div>`).join('')}</div></div>`;};
  if(!missing.length)return `<section class="view has-head has-actions"><div class="head">${headNav('cand')}<p class="say"><b>All ${iv.panel.length} in</b> for ${fn}.</p></div>
    <div class="body"><div class="rows">${iv.panel.map(card).join('')}</div></div>
    <div class="actions"><button class="btn primary" data-act="go" data-v="debrief">${ic('i-people')}Open debrief</button></div></section>`;
  if(onPanel&&!x.cards[me]){sc.as=me;const others=iv.panel.filter(p=>p!==me&&x.cards[p]).length;const done=SCR(x).every(c=>sc.r[c.k])&&sc.rec!==null;
  return `<section class="view has-head has-actions"><div class="head">${headNav('interviews')}
    <p class="say">Your scorecard for <span class="inav">${initials(x.name)}</span> <b>${fn}</b> · ${rlab(x)}.<span class="saymore"> ${others?`<b>${others}</b> already in, hidden till you submit.`:'You’re first.'}</span></p>
    <div class="meta"><span>${ic('i-people')}${esc(roundOf(x).name)}</span><span>${ic('i-cal')}${slotLabel(iv.slot)}</span><span>${ic('i-lock')}Only you can fill this</span></div></div>
  <div class="body"><div class="gside">
    <div class="stack" style="gap:12px">
      ${SCR(x).length?'':`<p class="small muted">This round has no criteria to rate. Give your overall view and notes.</p>`}${SCR(x).map(c=>`<div class="srow st"><div class="srow-top"><span class="tile">${ic(c.icon)}</span><b>${esc(c.name)}</b></div><div class="rate" role="group" aria-label="${esc(c.name)}">${[1,2,3,4].map(n=>`<button data-act="rate" data-k="${c.k}" data-n="${n}" aria-pressed="${sc.r[c.k]===n}">${n}<small>${RATE[n-1]}</small></button>`).join('')}</div></div>`).join('')}
      <div class="field" style="margin-top:8px"><b>Overall</b><div class="chips">${REC.map((r,i)=>`<button class="chip" data-act="rec" data-n="${i}" aria-pressed="${sc.rec===i}">${r}</button>`).join('')}</div></div>
      ${(roundOf(x).qs||[]).length?`<div class="stack" style="gap:10px"><b>${roundOf(x).kind==='call'?'Checklist <span class="muted" style="font-weight:400">· their answers</span>':'Notes per question <span class="muted" style="font-weight:400">· what they said, in their words. Leave blank if you didn’t ask it</span>'}</b>${roundOf(x).qs.map((q,i)=>`<div class="field"><b class="small" style="font-weight:500">${i+1}. ${esc(q)}</b><textarea data-qn="${i}" rows="2" style="min-height:64px" aria-label="Notes for question ${i+1}" placeholder="${roundOf(x).kind==='call'?'Their answer':'e.g. Cut the export step because 4 of 5 users never used it'}">${esc((sc.qn||{})[i]||'')}</textarea></div>`).join('')}</div>`:''}
      <div class="stack" style="gap:10px" id="qxList">${(sc.qx||[]).map((r,i)=>`<div class="field qx"><div class="row nowrap" style="gap:8px"><input data-qxq="${i}" value="${esc(r.q)}" placeholder="The question you asked" aria-label="Question you asked ${i+1}"><button class="iconbtn xsm" data-act="qxdel" data-i="${i}" aria-label="Remove this question">${ic('i-x')}</button></div><textarea data-qxn="${i}" rows="2" style="min-height:64px" aria-label="Notes for your question ${i+1}" placeholder="What they said">${esc(r.n)}</textarea></div>`).join('')}
        <button class="addc" data-act="qxadd" style="margin:0"><span class="tile">+</span>${roundOf(x).kind==='call'?'Something else that came up':(roundOf(x).qs||[]).length?'A question you asked that isn’t listed':'Add a question you asked'}</button></div>
      <div class="field"><b>Overall notes <span class="muted" style="font-weight:400">· what you saw, not who they are</span></b><textarea id="scNote" placeholder="Evidence for your ratings" style="min-height:90px">${esc(sc.note||'')}</textarea></div>
    </div>
    <div class="aside stack"><div class="card stack"><b class="small">${roundOf(x).kind==='call'?'Call checklist':'Interview kit'} · ${esc(roundOf(x).name)}</b><p class="xs muted" style="margin-top:-6px">${roundOf(x).kind==='call'?'Logistics only. This call isn’t scored on the criteria.':SCR(x).length?`You score: ${SCR(x).map(c=>esc(c.short||c.name)).join(', ')}. Other rounds cover the rest.`:'No criteria scored in this round.'}</p>${(roundOf(x).qs||[]).length?(roundOf(x).qs||[]).map((q,i)=>`<p class="small" style="display:flex;gap:8px"><span class="mono muted">${i+1}</span>${esc(q)}</p>`).join(''):`<p class="xs muted" style="margin:0">No set questions for this round. Rate the criteria from what you saw, and add the questions you asked.</p>`}</div><b class="small">Rest of the panel</b>${iv.panel.filter(p=>p!==me).map(p=>`<div class="locked"><span class="avatar">${initials(P[p].n)}</span><div class="skel"><i style="width:60%"></i><i style="width:85%"></i></div>${x.cards[p]?`<span class="xs muted" style="display:flex;gap:5px;align-items:center">${ic('i-lock')}Hidden</span>`:'<span class="xs muted">Not yet</span>'}</div>`).join('')}
      <p class="xs muted">Hidden until you submit yours.</p></div>
  </div></div>
  <div class="actions"><button class="btn primary" data-act="submitscore" ${soft(done)}>${ic('i-send')}${bl('Submit scorecard')}</button></div></section>`;}
  /* status view: admin / HM not on the panel, or a panelist who already sent theirs */
  const can=ROLE()!=='int';const inN=iv.panel.length-missing.length;
  return `<section class="view has-head"><div class="head">${headNav(ROLE()==='int'?'interviews':'cand')}
    <p class="say">Scorecards for <span class="inav">${initials(x.name)}</span> <b>${fn}</b>: <b>${inN} of ${iv.panel.length}</b> in.</p>
    <div class="meta"><span>${ic('i-cal')}${slotLabel(iv.slot)}</span><span>${ic('i-lock')}${onPanel?'Yours is in':'Only panelists fill these'}</span></div></div>
  <div class="body"><div class="rows">
    ${iv.panel.filter(p=>x.cards[p]).map(card).join('')}
    ${missing.map(p=>`<div class="revealed st"><div class="row between nowrap"><span class="row nowrap"><span class="avatar">${initials(P[p].n)}</span><span><b style="font-weight:500">${P[p].n}</b><span class="xs muted" style="display:block">${P[p].r} · not submitted</span></span></span>${pill('Due','var(--warn)')}</div>${(x.autoRem||{})[p]?`<p class="xs muted" style="margin:8px 0 0;display:flex;gap:6px;align-items:center">${ic('i-bell')}Reminded automatically · next one in 24 hours</p>`:''}
      ${can?`<div class="row nowrap" style="margin-top:10px;flex-wrap:wrap"><button class="btn sm" data-act="scremind" data-p="${p}" ${(x.reminded||{})[p]?'disabled':''}>${ic('i-send')}${bl((x.reminded||{})[p]?'Reminder sent':`Remind ${first(P[p].n)}`)}</button><button class="btn sm ghost" data-act="asuser" data-u="${p}">${bl(`Sign in as ${first(P[p].n)} to fill it`)}</button></div>`:''}</div>`).join('')}
  </div><p class="xs muted" style="margin-top:12px">${can?`Debrief opens when all ${iv.panel.length} are in. Lens reminds anyone missing ${AUTO_REM}.`:'Debrief opens when everyone submits.'}</p></div></section>`;};

R.noaccess=()=>{const u=USERS[state.me],v=state.denied||'';const nm=(JR.find(j=>j[0]===v)||[,'This page'])[1];
  return `<section class="view light"><div class="empty"><span class="tile dark" style="width:56px;height:56px;border-radius:18px">${ic('i-lock')}</span><h2 class="tt">${esc(nm)} is not open to you</h2>
  <p class="small muted">You're signed in as ${esc(first(ME().n))}, ${u.lab.toLowerCase()}. ${u.role==='int'?'Interviewers see only the candidates they interview, and their own scorecards.':'Hiring managers see their roles, interviews and offers. Settings, criteria and the audit log stay with admins.'} Ask Neha if you need access.</p>
  <div class="row nowrap" style="justify-content:center"><button class="btn" data-act="go" data-v="home">${bl('Go home')}</button><button class="btn primary" data-act="asuser" data-u="neha">${bl('Sign in as Neha (prototype)')}</button></div></div></section>`;};
/* debrief */
R.debrief=()=>{const x=sel(),fn=first(x.name);
  if(!x.cards||!x.interview||x.interview.panel.some(p=>!x.cards[p]))return emptyView('Debrief not ready',`Waiting for scorecards on ${fn}.`,'score','Go to scorecard');
  const ps=x.interview.panel;const avg=ps.reduce((a,p)=>a+x.cards[p].rec,0)/ps.length;const lean=REC[Math.round(avg)];
  const disc=SCR(x).filter(c=>{const v=ps.map(p=>x.cards[p].r[c.k]||0);return Math.max(...v)-Math.min(...v)>=2;});const decided=x.stage!=='debrief';
  return `<section class="view has-head has-panel"><div class="head">${headNav('interviews')}
    <p class="say"><b>${fn}</b> · ${rlab(x)} · ${esc(roundOf(x).name)} · panel leans <span class="ipill">${lean}</span>${disc.length?` · <b>${disc.length} to discuss</b>`:''}</p></div>
  <div class="body"><div class="gside">
    <div class="stack" style="gap:16px">
      <div class="matrix" tabindex="0" role="region" aria-label="Scorecards by criterion"><table><thead><tr><th>Criterion</th><th>Screener</th>${ps.map(p=>`<th><span class="who"><span class="avatar sm">${initials(P[p].n)}</span>${first(P[p].n)}</span></th>`).join('')}<th></th></tr></thead>
      <tbody>${SCR(x).map(c=>{const pt=pts(x,c),s=stat(pt,c.max);return `<tr class="st"><td>${esc(c.short||c.name)}</td><td><span class="mono small">${pt}/${c.max}</span> <span class="idot" style="--c:${STAT[s][1]};font-size:22px"></span></td>${ps.map(p=>`<td><span class="dots4">${[1,2,3,4].map(n=>`<i class="${n<=(x.cards[p].r[c.k]||0)?'on':''}"></i>`).join('')}</span></td>`).join('')}<td>${disc.includes(c)?'<span class="pill lime">Discuss</span>':''}</td></tr>`;}).join('')}
      <tr><td><b style="font-weight:500">Overall</b></td><td></td>${ps.map(p=>`<td><span class="pill ${x.cards[p].rec>=2?'lime':''}" style="${x.cards[p].rec>=2?'':'background:var(--bg)'}">${REC[x.cards[p].rec]}</span></td>`).join('')}<td></td></tr></tbody></table></div>
      ${disc.length?`<div class="ybar"><span class="pill">Discuss</span><span>${disc.map(c=>c.short||c.name).join(', ')}: ratings differ by 2+.</span></div>`:''}
      ${notesHTML(x)}
      ${roundsHTML(x)}
    </div>
    <div class="aside">${decided?`<div class="panel fixm"><h3>Decision made</h3><p>${SNAME[x.stage]}</p><button class="btn lime" data-act="${x.stage==='rejected'?'sentmail':'go'}" data-v="offer" data-f="application" data-id="${x.id}">${x.stage==='rejected'?'See sent feedback':'Open offer'}</button></div>`:(canCall(x)?`<div class="panel fixm">${lastRound(x)?swipeHTML('Make an offer?','','Offer','Reject',{hold:true}):swipeHTML(`Move to round ${RI(x)+2}?`,`→ ${esc(roundsOf(jobOf(x))[RI(x)+1].name)} · ← reject`,'Advance','Reject')}${holdLink(x)}</div>`:lastRound(x)&&ROLE()==='admin'?`<div class="panel fixm hmp"><div class="hmhead"><h3>${first(P.arjund.n)} makes the final call</h3><span class="roletag">Hiring manager</span></div><div class="decbtns">${x.hold?'':`<button class="btn outline" data-act="holdbackup">${ic('i-clock')}${bl('Hold as backup')}</button>`}<button class="btn lime" data-act="hmnudge" ${x.hmNudged?'disabled':''}>${ic('i-bell')}${bl(x.hmNudged?'Reminder sent':'Remind '+first(P.arjund.n))}</button></div>${x.hold?`<p class="xs muted">Backup · ${holdTag(x)} (${esc(holdUntil(x))})</p>`:''}<button class="protolink" data-act="asuser" data-u="arjund">${ic('i-spark')}Prototype: sign in as ${first(P.arjund.n)} to decide</button></div>`:`<div class="panel fixm hmp"><div class="hmhead"><h3>Waiting on ${first(P.arjund.n)}</h3><span class="roletag">Hiring manager</span></div></div>`)}</div>
  </div></div></section>`;};

function notesHTML(x){const ps=x.interview.panel,qs=roundOf(x).qs||[];const any=ps.some(p=>x.cards[p]&&(x.cards[p].note||Object.keys(x.cards[p].qn||{}).length||(x.cards[p].qx||[]).length));if(!any)return '';
  const extra=ps.flatMap(p=>(x.cards[p].qx||[]).map(r=>[p,r])),unasked=qs.filter((q,i)=>!ps.some(p=>(x.cards[p].qn||{})[i]));
  return `<div class="card stack"><b class="small">What the panel wrote</b>${qs.map((q,i)=>{const ans=ps.filter(p=>(x.cards[p].qn||{})[i]);return ans.length?`<div class="stack" style="gap:6px"><span class="xs muted">${i+1}. ${esc(q)}</span>${ans.map(p=>`<p class="small" style="margin:0"><b style="font-weight:500">${esc(first(P[p].n))}:</b> ${esc(x.cards[p].qn[i])}</p>`).join('')}</div>`:'';}).join('')}
    ${extra.length?`<div class="stack" style="gap:6px"><span class="xs muted">Also asked, not in the kit</span>${extra.map(([p,r])=>`<p class="small" style="margin:0"><b style="font-weight:500">${esc(first(P[p].n))}</b> asked “${esc(r.q)}” ${esc(r.n)}</p>`).join('')}</div>`:''}
    ${unasked.length?`<p class="xs muted" style="margin:0">Nobody wrote notes for: ${unasked.map(q=>esc(q)).join(' · ')}</p>`:''}

function fbHTML(t){return String(t).split(/\n\n+/).map(par=>{const ls=par.split('\n');
  if(/^• /.test(ls[0])&&ls.slice(1).some(l=>/^  [^:]+: /.test(l))){const rows=ls.slice(1).map(l=>{const m=l.trim().match(/^([^:]+):\s*(.*)$/);return m?`<div class="fbrow"><dt>${esc(m[1])}</dt><dd>${esc(m[2].charAt(0).toUpperCase()+m[2].slice(1))}</dd></div>`:'';}).join('');
    return `<div class="fbreq"><b>${esc(ls[0].replace(/^• /,''))}</b><dl>${rows}</dl></div>`;}
  return `<p>${ls.map(esc).join('<br>')}</p>`;}).join('');}
R.cfeedback=()=>{const prev=state.fbPreview;const x=sel(),fn=first(x.name);

R.coffer=()=>{const x=sel(),fn=first(x.name);

function initIntro(){const itr=$('#itr');if(!itr)return;showIntro(IT.i,false);
  const vp=itr.querySelector('.ivp');let x0=null,y0=0,t0=0,moved=false;
  vp.addEventListener('pointerdown',e=>{if(IT.i===3)return;x0=e.clientX;y0=e.clientY;t0=Date.now();moved=false;IT.paused=true;if(IT.anim)IT.anim.pause?.();});
  const up=e=>{if(x0===null)return;const dx=e.clientX-x0,dy=e.clientY-y0;IT.paused=false;const held=Date.now()-t0>350;x0=null;
    if(Math.abs(dx)>40&&Math.abs(dx)>Math.abs(dy))return showIntro(IT.i+(dx<0?1:-1));
    if(!held&&Math.abs(dx)<8&&!e.target.closest('button')){const r=vp.getBoundingClientRect();return showIntro(IT.i+(e.clientX<r.left+r.width*0.3?-1:1));}
    if(IT.anim)IT.anim.play?.();};
  vp.addEventListener('pointerup',up);vp.addEventListener('pointercancel',up);
  vp.addEventListener('keydown',e=>{});}

  ed.d=c?{k:c.k,name:c.name,icon:c.icon,kw:[...c.kw],where:[...c.where],w:c.w,max:c.max,tpl:c.tpl}:{k:null,name:'',icon:'i-target',kw:[],where:['Résumé','Portfolio'],w:'nice',max:15,tpl:null};
  openSheet(edShell(),'ed');drawEd(0);}
function openExcl(i){ed.mode='excl';ed.steps=['excl'];ed.i=0;ed.confirm=false;ed.ex={i,name:i===null?'':curJob().excl[i]};openSheet(edShell(),'ed');drawEd(0);}

{const EX=['“Design jobs in Bengaluru, 20L+”','“Remote frontend, replies fast”','“Junior design roles near me”','“Which teams actually reply?”'];let k=0;setInterval(()=>{const el=document.getElementById('askRot');if(!el||REDUCE)return;k=(k+1)%EX.length;el.animate([{opacity:1,transform:'none'},{opacity:0,transform:'translateY(-6px)'}],{duration:220}).onfinish=()=>{el.textContent=EX[k];el.animate([{opacity:0,transform:'translateY(6px)'},{opacity:1,transform:'none'}],{duration:260,easing:'cubic-bezier(.32,.72,0,1)'});};},3200);}

/* ---------- Ask history: every conversation is kept, searchable, reopenable ---------- */
const AH_DAY=864e5,AH_NOW=()=>new Date(2026,9,16,10,30).getTime()+((performance.now()/1000)|0)*1000;
ASK.chats=[
 {id:'h1',ts:AH_NOW()-2*36e5,turns:[{q:'Remote frontend jobs that reply fast'},{q:'Higher pay'}]},
 {id:'h2',ts:AH_NOW()-AH_DAY-5*36e5,turns:[{q:'Product manager roles in Pune'},{q:'Any city'}]},
 {id:'h3',ts:AH_NOW()-3*AH_DAY,turns:[{q:'Junior design roles near me'}]},
 {id:'h4',ts:AH_NOW()-9*AH_DAY,turns:[{q:'Data analyst jobs in Bengaluru above 12 lakhs'},{q:'Teams that reply fast'},{q:'Only remote'}]}];
ASK.cur=null;
const ahTitle=c=>{const q=c.turns[0].q;return q.length>42?q.slice(0,40).trim()+'…':q;};
function ahGroup(ts){const d=AH_NOW()-ts;return d<AH_DAY?'Today':d<2*AH_DAY?'Yesterday':d<7*AH_DAY?'Previous 7 days':'Older';}
const ahWhen=ts=>{const d=new Date(ts),g=ahGroup(ts);return g==='Today'||g==='Yesterday'?d.toLocaleTimeString('en-IN',{hour:'numeric',minute:'2-digit'}):d.getDate()+' '+['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getMonth()];};
function ahReplay(c){let f={};c.turns.forEach(t=>{const l=t.q.toLowerCase();if(l==='any city'){f.city=null;f.mode=null;}else if(l==='any pay')f.min=null;else if(l==='any reply time')f.fast=null;else if(l==='something more senior')f.senior=true;f=askParse(t.q,f);t.f=Object.assign({},f);});return f;}
ASK.chats.forEach(ahReplay);
function ahLog(q,f){let c=ASK.chats.find(x=>x.id===ASK.cur);if(!c){c={id:'c'+Date.now(),ts:AH_NOW(),turns:[]};ASK.chats.unshift(c);ASK.cur=c.id;}c.turns.push({q,f:Object.assign({},f)});c.ts=AH_NOW();ASK.chats=[c].concat(ASK.chats.filter(x=>x!==c));ahRail();}
function ahRows(q){q=(q||'').trim().toLowerCase();const l=ASK.chats.filter(c=>!q||c.turns.some(t=>t.q.toLowerCase().includes(q)));
  if(!ASK.chats.length)return `<div class="ahempty"><b>No chats yet</b><span class="xs muted">What you ask is kept here so you can pick up where you left off.</span></div>`;
  if(!l.length)return `<div class="ahempty"><b>Nothing matches “${esc(q)}”</b><span class="xs muted">Search looks through everything you asked.</span></div>`;
  let g0='',o='';l.forEach(c=>{const g=ahGroup(c.ts);if(g!==g0){o+=`<p class="ahg">${g}</p>`;g0=g;}const last=c.turns[c.turns.length-1],n=askFind(last.f).length;
    const hit=q?c.turns.find(t=>t.q.toLowerCase().includes(q)):null;const hl=s=>q?esc(s).replace(new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig'),'<mark>$1</mark>'):esc(s);
    o+=`<div class="ahrow${c.id===ASK.cur?' cur':''}"><button class="ahopen" data-ahopen="${c.id}"><b>${hl(ahTitle(c))}</b><span class="xs muted">${hit&&hit!==c.turns[0]?'“'+hl(hit.q)+'” · ':''}${c.turns.length} ${c.turns.length>1?'questions':'question'} · ${n} ${n===1?'role':'roles'} now · ${ahWhen(c.ts)}</span></button><button class="iconbtn ahdel" data-ahdel="${c.id}" aria-label="Delete chat">${ic('i-trash')}</button></div>`;});return o;}
function ahSheet(){openSheet(`<span class="grab"></span><div class="row between nowrap"><h2 style="font-size:22px">Your chats</h2><button class="iconbtn" data-act="closesheet" aria-label="Close">${ic('i-x')}</button></div>
  <div class="jsearch ahsearch"><svg class="i"><use href="#i-search"/></svg><input type="text" id="ahq" placeholder="Search your chats" aria-label="Search your chats"></div>
  <button class="lrow ahnew" data-ahnew="1"><span class="tile">${ic('i-plus')}</span><div><b>New chat</b><span class="sub">Start fresh, no filters carried over</span></div></button>
  <div id="ahlist" class="ahlist">${ahRows('')}</div>
  ${ASK.chats.length?`<button class="link xs ahclear" data-ahclear="1">Clear all chats</button>`:''}<p class="xs muted" style="margin-top:-4px">Only you can see these. Recruiters never see what you search.</p>`);}
function ahOpen(id){const c=ASK.chats.find(x=>x.id===id);if(!c)return;closeSheet();ASK.cur=id;setTimeout(ahRail);const last=c.turns[c.turns.length-1];ASK.f=Object.assign({},c.turns.length>1?c.turns[c.turns.length-2].f:{});ASK.replay=true;
  if(state.view!=='cask'){state.askQ=last.q;go('cask');}else askAnswer(last.q);}
function ahNew(){closeSheet();ASK.cur=null;ASK.f={};ASK.q='';ASK.r=null;if(state.view!=='cask')go('cask');else{askHome();ahRail();}}
function ahPrev(){return '';const c=ASK.chats.find(x=>x.id===ASK.cur);if(!c||c.turns.length<2)return '';return `<div class="ahprev">${c.turns.slice(0,-1).map(t=>`<span>${esc(t.q)}</span>`).join('<i></i>')}</div>`;}
document.addEventListener('click',e=>{const t=e.target.closest&&e.target.closest('[data-ahopen],[data-ahdel],[data-ahnew],[data-ahclear],[data-ahsheet]');if(!t)return;e.preventDefault();e.stopPropagation();
  if(t.dataset.ahsheet)return ahSheet();if(t.dataset.ahnew)return ahNew();if(t.dataset.ahopen)return ahOpen(t.dataset.ahopen);
  if(t.dataset.ahdel){const row=t.closest('.ahrow'),id=t.dataset.ahdel,i=ASK.chats.findIndex(x=>x.id===id),c=ASK.chats[i];ASK.chats.splice(i,1);if(ASK.cur===id)ASK.cur=null;
    const done=()=>{const l=$('#ahlist');if(l)l.innerHTML=ahRows(($('#ahq')||{}).value);ahRail();};if(row&&!REDUCE)row.animate([{opacity:1,transform:'none'},{opacity:0,transform:'translateX(-24px)'}],{duration:220}).onfinish=done;else done();
    toastUndo('Chat deleted',()=>{ASK.chats.splice(i,0,c);done();});return;}
  if(t.dataset.ahclear){const keep=ASK.chats.slice();ASK.chats=[];ASK.cur=null;ahSheet();toastUndo('All chats cleared',()=>{ASK.chats=keep;if($('#ahlist'))ahSheet();});}},true);
function ahRail(){const r=$('#ahrail');if(r)r.innerHTML=ahRows(($('#ahqr')||{}).value);}
document.addEventListener('input',e=>{if(e.target.id==='ahqr')ahRail();if(e.target.id==='ahq'){const l=$('#ahlist');if(l)l.innerHTML=ahRows(e.target.value);}},true);
